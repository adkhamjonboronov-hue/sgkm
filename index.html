                    { name: { uz: "Муродов Бобир", ru: "Муродов Бобир", en: "Murodov Bobir" }, years: { uz: "Фаолият йиллари", ru: "Годы деятельности", en: "Years of service" } },
                    { name: { uz: "Ибадуллаевич Ғайрат Каримович", ru: "Ибадуллаевич Гайрат Каримович", en: "Ibadullayevich Gayrat Karimovich" }, years: { uz: "Ҳозиргача", ru: "По настоящее время", en: "To present" } }
                ]
            },
            {
                id: "7",
                members: [
                    { name: { uz: "Алишер ака", ru: "Алишер ака", en: "Alisher aka" }, years: { uz: "Фаолият йиллари", ru: "Годы деятельности", en: "Years of service" } },
                    { name: { uz: "Жабборов Шокир Давлатович", ru: "Жабборов Шокир Давлатович", en: "Jabborov Shokir Davlatovich" }, years: { uz: "Фаолият йиллари", ru: "Годы деятельности", en: "Years of service" } },
                    { name: { uz: "Очилов Асқар Мухаммадиевич", ru: "Очилов Аскар Мухаммадиевич", en: "Ochilov Askar Mukhammadievich" }, years: { uz: "2025 йилдан ҳозиргача", ru: "2025 - по н.в.", en: "2025 - present" } }
                ]
            }
        ];

        const defaultAvatarSvg = `<svg class="svg-avatar" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;

        function renderHeaderAndTabs() {
            const langData = i18n[currentLang];
            document.getElementById('headerTitle').innerText = langData.headerTitle;
            document.getElementById('headerSubtitle').innerText = langData.headerSubtitle;
            document.getElementById('searchInput').placeholder = langData.searchPlaceholder;
            document.getElementById('btnPrint').innerText = langData.btnPrint;
            document.getElementById('footerText').innerText = langData.footerText;

            const tabsContainer = document.getElementById('filterTabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(langData.tabs).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${key === activeCategory ? 'active' : ''}`;
                btn.innerText = langData.tabs[key];
                btn.onclick = (e) => filterCategory(key, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function renderSections(searchFilter = '') {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';
            const langData = i18n[currentLang];

            museumData.forEach(section => {
                if (activeCategory !== 'all' && section.id !== activeCategory) return;

                const filteredMembers = section.members.filter(m => {
                    const name = m.name[currentLang] || m.name.uz;
                    return name.toLowerCase().includes(searchFilter.toLowerCase());
                });

                if (filteredMembers.length === 0) return;

                const sectionEl = document.createElement('div');
                sectionEl.className = 'section-block';
                
                let cardsHTML = '';
                filteredMembers.forEach((member, idx) => {
                    const cardId = `img-${section.id}-${idx}`;
                    const name = member.name[currentLang] || member.name.uz;
                    const years = member.years[currentLang] || member.years.uz;

                    cardsHTML += `
                        <div class="card">
                            <div class="photo-box">
                                <img id="${cardId}" style="display:none;" alt="${name}">
                                <div id="holder-${cardId}" style="display:flex; flex-direction:column; align-items:center;">
                                    ${defaultAvatarSvg}
                                    <span class="upload-text">${langData.uploadText}</span>
                                </div>
                                <input type="file" accept="image/*" onchange="handleImageUpload(event, '${cardId}')" class="file-input" title="Расм танлаш учун босинг">
                            </div>
                            <div class="member-name">${name}</div>
                            <div class="member-years">${years}</div>
                        </div>
                    `;
                });

                sectionEl.innerHTML = `
                    <div class="section-header">
                        <div class="section-header-bar"></div>
                        <h3 class="section-title">${langData.sections[section.id]}</h3>
                    </div>
                    <div class="cards-grid">
                        ${cardsHTML}
                    </div>
                `;

                container.appendChild(sectionEl);
            });
        }

        function handleImageUpload(event, targetImgId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgEl = document.getElementById(targetImgId);
                    const holderEl = document.getElementById(`holder-${targetImgId}`);
                    imgEl.src = e.target.result;
                    imgEl.style.display = 'block';
                    if (holderEl) holderEl.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function filterCategory(catId, btnEl) {
            activeCategory = catId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            
            const searchVal = document.getElementById('searchInput').value;
            renderSections(searchVal);
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            renderHeaderAndTabs();
            renderSections(document.getElementById('searchInput').value);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderSections(e.target.value);
        });

        renderHeaderAndTabs();
        renderSections();
    </script>
</body>
</html>
